<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom Clicks Cursor</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="logo-area">
        <div class="logo-icon">W</div>
        <div>
          <h2>Custom Clicks Cursor</h2>
          <span class="version-tag">v1.0 &bull; Manifest V3</span>
        </div>
      </div>
      <label class="switch" title="Toggle Extension">
        <input type="checkbox" id="masterToggle" checked>
        <span class="slider"></span>
      </label>
    </header>

    <!-- Status Banner -->
    <div id="statusBanner" class="status-banner active">
      <span class="status-dot"></span>
      <span id="statusText">Custom Clicks cursors active</span>
    </div>

    <!-- Active Site Info -->
    <div class="card current-site-card">
      <div class="site-info">
        <span class="label">Current Site</span>
        <span id="currentDomain" class="domain-name">Detecting...</span>
      </div>
      <button id="toggleSiteBtn" class="btn btn-outline btn-sm">
        Pause on this site
      </button>
    </div>

    <!-- Quick Stats & Info -->
    <div class="quick-stats">
      <div class="stat-item">
        <span class="stat-val" id="activeMappingsCount">32</span>
        <span class="stat-lbl">Active Cursors</span>
      </div>
      <div class="stat-item">
        <span class="stat-val" id="excludedSitesCount">0</span>
        <span class="stat-lbl">Excluded Sites</span>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="actions">
      <button id="openOptionsBtn" class="btn btn-primary">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
        Open Full Settings & Hotspots
      </button>
      <button id="openTestBtn" class="btn btn-secondary">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
          <polyline points="10 9 9 9 8 9"></polyline>
        </svg>
        Open Cursor Test Suite
      </button>
    </div>
  </div>

  <script src="cursor-map.js"></script>
  <script src="popup.js"></script>
</body>
</html>
